# ── Channels ─────────────────────────────────────────────────────────────────
# One block per channel/account. Clone a block to add a channel (Playbook §7).
# `--channel <key>` selects which block to run. Per-channel keys override settings.yaml.

channels:

  motivation:
    name: "Disciplina Diária"
    niche: motivação
    audience: "homens e mulheres de 18–34 anos buscando autocontrole e evolução pessoal"
    angle: "motivação direta e sem enrolação, ancorada em estoicismo e ação prática"
    tone: "direto, intenso, cinematográfico"
    voice: pt-BR-AntonioNeural   # masculine, intense (overrides tts.edge_voice)
    visual_style: "cinematic, moody, slow-motion, urban, gym, nature, dramatic light"
    music_mood: "epic, building, inspirational"
    platforms: [youtube, tiktok, instagram, facebook]
    series: false
    posts_per_day: 2

  money:
    name: "Mecânica do Dinheiro"
    niche: finanças
    audience: "pessoas de 20–40 anos que querem dicas práticas de dinheiro e renda extra"
    angle: "um conceito financeiro prático por vídeo, explicado de forma simples"
    tone: "confiante, claro, levemente contrário ao senso comum"
    voice: pt-BR-ThalitaMultilingualNeural
    visual_style: "clean, modern, money, city, charts b-roll, lifestyle"
    music_mood: "upbeat, modern, light"
    platforms: [youtube, tiktok, instagram, facebook]
    inject_disclaimer: finance     # pulls settings.compliance.disclaimers.finance
    posts_per_day: 1

  facts:
    name: "Fatos Surpreendentes"
    niche: psicologia
    audience: "público curioso em geral, todas as idades"
    angle: "fatos surpreendentes de psicologia e ciência com gancho de curiosidade"
    tone: "intrigante, amigável, com ritmo acelerado"
    voice: pt-BR-FranciscaNeural
    visual_style: "abstract, brain, space, nature macro, satisfying visuals"
    music_mood: "curious, playful, light electronic"
    platforms: [youtube, tiktok, instagram, facebook]
    posts_per_day: 1

