# ── Channels ─────────────────────────────────────────────────────────────────
# One block per channel/account. Clone a block to add a channel (Playbook §7).
# `--channel <key>` selects which block to run. Per-channel keys override settings.yaml.

channels:

  motivation:
    name: "Disciplina Diária"
    niche: motivação
    audience: "homens e mulheres de 18–34 anos buscando autocontrole e evolução pessoal"
    angle: "motivação direta e sem enrolação, ancorada em estoicismo e ação prática"
    tone: "direto, intenso, cinematográfico"
    voice: pt-BR-AntonioNeural   # masculine, intense (overrides tts.edge_voice)
    # PROFESSIONAL: High-quality cinematic B-roll keywords for stock search
    visual_style: "cinematic slow motion, dramatic sunrise, mountain landscape, ocean waves, city timelapse, gym workout, running trail, meditation nature, golden hour, epic drone footage"
    music_mood: "epic, building, inspirational, cinematic, motivational"
    platforms: [youtube, tiktok, instagram, facebook]
    series: false
    posts_per_day: 2
    # PROFESSIONAL: Optimized for high-quality video sources
    prefer_videos: true
    source_priority: [youtube, ddg_video_ytdlp, pexels_photo, ddg_image]
    trends:
      mode: mixed                # nicho tem pouco "notícia" — ancorar só em busca
      sources: [yt_suggest]
      seed: "disciplina"

  money:
    name: "Mecânica do Dinheiro"
    niche: finanças
    audience: "pessoas de 20–40 anos que querem dicas práticas de dinheiro e renda extra"
    angle: "um conceito financeiro prático por vídeo, explicado de forma simples"
    tone: "confiante, claro, levemente contrário ao senso comum"
    voice: pt-BR-ThalitaMultilingualNeural
    # PROFESSIONAL: Clean, modern financial B-roll for professional look
    visual_style: "modern city skyline, financial district, stock market screens, luxury lifestyle, business handshake, gold coins, investment charts, modern office, technology workspace, success concept"
    music_mood: "upbeat, modern, corporate, tech, professional"
    platforms: [youtube, tiktok, instagram, facebook]
    inject_disclaimer: finance     # pulls settings.compliance.disclaimers.finance
    posts_per_day: 1
    # PROFESSIONAL: Optimized for high-quality video sources
    prefer_videos: true
    source_priority: [youtube, ddg_video_ytdlp, pexels_photo, ddg_image]
    trends:
      mode: strict
      sources: [google_news, ddg_news, yt_suggest]
      news_query: "investimentos OR renda fixa when:7d"
      seed: "como investir"

  facts:
    name: "Fatos Surpreendentes"
    niche: psicologia
    audience: "público curioso em geral, todas as idades"
    angle: "fatos surpreendentes de psicologia e ciência com gancho de curiosidade"
    tone: "intrigante, amigável, com ritmo acelerado"
    voice: pt-BR-FranciscaNeural
    # PROFESSIONAL: Engaging visual B-roll for science/psychology content
    visual_style: "brain animation, neural network, space nebula, microscope cells, abstract particles, nature macro closeup, laboratory science, technology hologram, satisfying fluid, cosmic galaxy"
    music_mood: "curious, playful, electronic, sci-fi, mysterious"
    platforms: [youtube, tiktok, instagram, facebook]
    posts_per_day: 1
    # PROFESSIONAL: Optimized for high-quality video sources
    prefer_videos: true
    source_priority: [youtube, ddg_video_ytdlp, pexels_photo, ddg_image]
    trends:
      mode: strict
      sources: [google_news, ddg_news]
      news_query: "ciência OR descoberta científica when:7d"
      seed: "curiosidades científicas"

  videogame:
    name: "GTA 6 News"
    niche: gaming
    audience: "fãs de GTA e jogos de ação, 18–35 anos"
    angle: "notícias, análises e curiosidades sobre GTA 6 com visuais impactantes"
    tone: "empolgado, informativo, levemente especulativo"
    voice: pt-BR-AntonioNeural
    # PROFESSIONAL: High-energy gaming visuals for engagement
    visual_style: "gta 6 gameplay, gta 6 trailer, vice city night, neon cityscape, car chase, character customization, open world exploration, cinematic game footage, realistic graphics, action sequence"
    music_mood: "cinematic, epic, modern, gaming, intense"
    platforms: [youtube, tiktok, instagram, facebook]
    inject_disclaimer: gaming
    posts_per_day: 2
    # Gaming: motion footage (gameplay/trailers) strongly preferred over stills,
    # and YouTube is the primary source since Pexels has no game footage.
    prefer_videos: true
    source_priority: [youtube, ddg_video_ytdlp, ddg_image, pexels_photo]
    # Per-channel overrides (deep-merged into the global sections by src/config.py):
    trends:
      mode: strict
      sources: [google_news, ddg_news, yt_suggest]
      news_query: "GTA 6 when:7d"
      seed: "gta 6"
    visuals:
      provider: scraper          # GTA gameplay/trailers não existem no Pexels
      scraper_mode: best
      # PROFESSIONAL: Prioritize YouTube for gaming footage, fallback to images
      scraper_sources: [youtube, ddg_video_ytdlp, ddg_image, pexels_photo]
      # PROFESSIONAL: Ensure we get video clips for gaming content
      min_clip_seconds: 2.0
    video:
      cut_every_seconds: 3.5      # PROFESSIONAL: slightly faster cuts for gaming energy


